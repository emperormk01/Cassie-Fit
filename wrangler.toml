name = "cassie-fit"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "cassie-fit-db"
database_id = "3fbf44be-80c5-4442-876b-67b374bbba1d"

routes = [
  { pattern = "cassie-fit.auxlo.xyz", custom_domain = true }
]
